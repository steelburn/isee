<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>isee — camera watch desk</title>
<meta name="description" content="Local camera watch desk with face recognition and object detection, exposed over HTTP and MCP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312574B'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23F3F1EC' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23F3F1EC'/%3E%3C/svg%3E">
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Sections">
    <a class="brand" href="#/live" aria-label="isee home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word">isee</span>
    </a>

    <nav class="nav" id="nav">
      <a class="nav-item" href="#/live" data-route="live">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="4" width="16" height="12" rx="2"/><circle cx="10" cy="10" r="3"/></svg>
        <span>Live</span>
      </a>
      <a class="nav-item" href="#/people" data-route="people">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3.2"/><path d="M4 17c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"/></svg>
        <span>People</span>
      </a>
      <a class="nav-item" href="#/events" data-route="events">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.4"/><path d="M10 6v4.3l2.8 1.7"/></svg>
        <span>Events</span>
      </a>
      <a class="nav-item" href="#/settings" data-route="settings">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h9M15 6h2M3 14h2M8 14h9"/><circle cx="13" cy="6" r="2"/><circle cx="6" cy="14" r="2"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="rail-foot">
      <div class="rail-status" id="rail-status">
        <span class="dot" data-tone="idle"></span>
        <span class="rail-status-text mono" id="rail-status-text">connecting</span>
      </div>
      <a class="rail-mcp mono" id="rail-mcp" href="#/settings">mcp · /mcp</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">Live</h1>
        <p class="topbar-sub mono" id="view-sub"></p>
      </div>
      <div class="topbar-actions">
        <time class="wall-clock mono" id="wall-clock" aria-label="Current time">--:--:--</time>
        <button class="btn btn-primary" id="add-camera-btn" type="button">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
          <span>Add camera</span>
        </button>
      </div>
    </header>

    <div class="canvas" id="view-root"></div>
  </main>
</div>

<div class="modal-root" id="modal-root" hidden>
  <div class="scrim" data-close="1"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal">
    <header class="modal-head">
      <h2 id="modal-title">—</h2>
      <button class="icon-btn" type="button" data-close="1" aria-label="Close dialog">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modal-body"></div>
    <footer class="modal-foot" id="modal-foot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
